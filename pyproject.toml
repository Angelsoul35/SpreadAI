[project]
name = "spreadai"
version = "1.0.0"
description = "Document AI for financial statements: extract a balance sheet and income statement, validate the accounting, compute ratios, and draft a credit memo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pandas>=2.2",
  "numpy>=2.1",
  "pdfplumber>=0.11",
  "reportlab>=4.2",
  "httpx>=0.28",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]
research = ["scikit-learn>=1.5"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "httpx>=0.28", "scikit-learn>=1.5"]

[project.scripts]
spreadai = "spreadai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spreadai*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
